<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Games</title>
<style>
:root{--bg:#E8EDEA;--panel:#F9FBFA;--ink:#13201B;--muted:#5A6B64;--line:#CFD9D4;--accent:#1D7459}
@media (prefers-color-scheme: dark){:root{--bg:#0C1210;--panel:#131B18;--ink:#E2EAE5;--muted:#8B9C95;--line:#24312C;--accent:#4CB893}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:48px 16px}
h1{margin:0 0 24px;font-size:28px}
a.card{display:block;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;color:inherit;text-decoration:none}
a.card:hover{border-color:var(--accent)}
a.card b{display:block;font-size:18px;color:var(--accent)}
a.card span{color:var(--muted);font-size:15px}
</style>
</head>
<body>
<main>
  <h1>Games</h1>
  <a class="card" href="holdem-trainer/"><b>Home Game Hold'em Trainer</b><span>Practice Texas Hold'em against home-game opponents, with a coach that grades each decision and suggests bet sizes.</span></a>
</main>
</body>
</html>
